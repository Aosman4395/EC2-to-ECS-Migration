name: Staging Terraform Plan and Apply

on:
  push:
    branches:
      - main
    paths:
      - "ECS-migration/terraform/environments/staging/**"
      - "!ECS-migration/terraform/environments/staging/bootstrap/**"
      - ".checkov-staging.yaml"
      - "ECS-migration/terraform/modules/**"
      - ".github/workflows/staging-infra.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_certificate_arn: ${{ vars.STAGING_CERTIFICATE_ARN }}
  TF_VAR_container_image: ${{ vars.STAGING_CONTAINER_IMAGE }}
  TF_VAR_container_name: ${{ vars.STAGING_CONTAINER_NAME || 'legacy-api' }}
  TF_VAR_container_port: ${{ vars.STAGING_CONTAINER_PORT || '5000' }}
  WORKING_DIR: ECS-migration/terraform/environments/staging

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required staging inputs
        run: |
          test -n "$TF_VAR_certificate_arn" || { echo "::error::Set repository variable STAGING_CERTIFICATE_ARN"; exit 1; }
          test -n "$TF_VAR_container_image" || { echo "::error::Set repository variable STAGING_CONTAINER_IMAGE to a scanned ECR image URI"; exit 1; }

      - name: Install Checkov
        run: python -m pip install checkov==3.2.526

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform fmt -check
          terraform fmt -check -recursive ../../modules

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Scan resolved Terraform plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform show -json tfplan > tfplan.json
          checkov --config-file ../../../../.checkov-staging.yaml -f tfplan.json --framework terraform_plan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-terraform-plan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan

    environment:
      name: Migration

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: staging-terraform-plan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve -lock-timeout=5m tfplan
