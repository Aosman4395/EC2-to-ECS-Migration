name: Staging Terraform Plan and Apply

on:
  workflow_call:
    inputs:
      container_image:
        description: Exact image URI; blank retains the image currently used by ECS
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      container_image:
        description: Exact image URI; leave blank to retain the current ECS image
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Select deployment image
        env:
          REQUESTED_IMAGE: ${{ inputs.container_image }}
        run: |
          IMAGE_URI="$REQUESTED_IMAGE"
          if [ -z "$IMAGE_URI" ]; then
            TASK_DEFINITION=$(aws ecs describe-services \
              --cluster migration-ecs-cluster \
              --services api-service \
              --query 'services[0].taskDefinition' --output text)
            if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
              echo "No existing ECS service. Run the build workflow or provide an explicit image URI."
              exit 1
            fi
            aws ecs describe-task-definition \
              --task-definition "$TASK_DEFINITION" --output json > /tmp/current-task.json
            IMAGE_URI=$(python3 - <<'PYTHON'
          import json
          with open('/tmp/current-task.json') as task_file:
              task = json.load(task_file)['taskDefinition']
          containers = [c for c in task['containerDefinitions']
                        if any(e['name'] == 'DB_HOST' for e in c.get('environment', []))]
          if len(containers) != 1:
              raise SystemExit('Cannot identify the API container; provide an explicit image URI.')
          print(containers[0]['image'])
          PYTHON
            )
          fi
          if [ -z "$IMAGE_URI" ] || [[ "$IMAGE_URI" =~ [[:space:]] ]]; then
            echo "Invalid image URI."
            exit 1
          fi
          echo "CONTAINER_IMAGE=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "Deploying image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        working-directory: ./ECS-migration/terraform/environments/staging
        run: |
          checkov -d . --framework terraform \
          --skip-path bootstrap \
          --skip-check CKV_AWS_2,CKV2_AWS_20,CKV_AWS_378,CKV_AWS_103,CKV_AWS_274,CKV_AWS_130,CKV_AWS_260,CKV_AWS_24,CKV_AWS_382,CKV_AWS_126,CKV_AWS_135,CKV_TF_1,CKV_AWS_91,CKV_AWS_150,CKV_AWS_136,CKV_AWS_158,CKV_AWS_338,CKV_AWS_65,CKV2_AWS_5,CKV2_AWS_61,CKV_AWS_18,CKV2_AWS_11,CKV2_AWS_28,CKV2_AWS_62,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_12    

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform init

      - name: Terraform Validate
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./ECS-migration/terraform/environments/staging
        run: |
          terraform plan \
            -var="container_image=${CONTAINER_IMAGE}" \
            -out=tfplan \
            -lock-timeout=5m

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-terraform-plan
          path: ./ECS-migration/terraform/environments/staging/tfplan

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: Migration

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: staging-terraform-plan
          path: ./ECS-migration/terraform/environments/staging

      - name: Terraform Apply
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform apply -auto-approve -lock-timeout=5m tfplan