name: Staging Terraform Plan and Apply

on:
  push:
    branches:
      - main
    paths:
      - "ECS-migration/terraform/environments/staging/**"
      - "ECS-migration/terraform/modules/**"
      - ".github/workflows/staging-infra.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Get latest ECR image
        run: |
          IMAGE_TAG=$(aws ecr describe-images \
            --repository-name migration-repository \
            --query 'sort_by(imageDetails[?imageTags != `null`],&imagePushedAt)[-1].imageTags[0]' \
            --output text)

          if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "None" ]; then
            echo "No tagged image found in ECR."
            exit 1
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/migration-repository:${IMAGE_TAG}"

          echo "CONTAINER_IMAGE=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Using image: ${IMAGE_URI}"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        working-directory: ./ECS-migration/terraform/environments/staging
        run: |
          checkov -d . --framework terraform \
          --skip-path bootstrap \
          --skip-check CKV_AWS_2,CKV2_AWS_20,CKV_AWS_378,CKV_AWS_103,CKV_AWS_274,CKV_AWS_130,CKV_AWS_260,CKV_AWS_24,CKV_AWS_382,CKV_AWS_126,CKV_AWS_135,CKV_TF_1,CKV_AWS_91,CKV_AWS_150,CKV_AWS_136,CKV_AWS_158,CKV_AWS_338,CKV_AWS_65,CKV2_AWS_5,CKV2_AWS_61,CKV_AWS_18,CKV2_AWS_11,CKV2_AWS_28,CKV2_AWS_62,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_12    

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform init

      - name: Terraform Validate
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./ECS-migration/terraform/environments/staging
        run: |
          terraform plan \
            -var="container_image=${CONTAINER_IMAGE}" \
            -out=tfplan \
            -lock-timeout=5m

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-terraform-plan
          path: ./ECS-migration/terraform/environments/staging/tfplan

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: Migration

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: staging-terraform-plan
          path: ./ECS-migration/terraform/environments/staging

      - name: Terraform Apply
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform apply -auto-approve -lock-timeout=5m tfplan