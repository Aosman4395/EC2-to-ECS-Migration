name: Staging Terraform Plan and Apply

on:
  push:
    branches:
      - main
    paths:
      - "ECS-migration/terraform/environments/staging/**"
      - "ECS-migration/terraform/modules/**"
      - ".github/workflows/staging-infra.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_VAR_container_image: ${{ vars.STAGING_CONTAINER_IMAGE }}

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d ECS-migration/terraform --framework terraform \
            --skip-path ECS-migration/terraform/environments/staging/bootstrap

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform init

      - name: Terraform Validate
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-terraform-plan
          path: ./ECS-migration/terraform/environments/staging/tfplan

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: Migration

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: staging-terraform-plan
          path: ./ECS-migration/terraform/environments/staging

      - name: Terraform Apply
        working-directory: ./ECS-migration/terraform/environments/staging
        run: terraform apply -auto-approve -lock-timeout=5m tfplan