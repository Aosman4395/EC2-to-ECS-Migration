name: Build and Push Image to ECR

on:
  push:
    branches:
      - main
    paths:
      - "legacy-app/app/**"
      - "dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-and-push.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-and-push-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: migration-repository
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --no-cache \
            --pull \
            -f dockerfile \
            -t "$IMAGE_URI" .

      - name: Trivy Image Scan
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            "$IMAGE_URI"

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI"
          echo "Image pushed: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable STAGING_CONTAINER_IMAGE to this URI before running staging infrastructure." >> "$GITHUB_STEP_SUMMARY"
