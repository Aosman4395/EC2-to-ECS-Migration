name: Build and Push Image to ECR

on:
  push:
    branches:
      - main
    paths:
      - "legacy-app/app/**"
      - "dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-and-push.yaml"
      - "ECS-migration/terraform/environments/staging/**"
      - "ECS-migration/terraform/modules/**"
      - ".github/workflows/staging-infra.yaml"
      - "!**/tests/**" 

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-and-push-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: migration-repository
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build_image: ${{ steps.detect.outputs.build_image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect application changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path

          before = os.environ.get('BEFORE_SHA', '')
          build = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          if not before or set(before) == {'0'}:
              build = True
          elif not build:
              result = subprocess.run(
                  ['git', 'diff', '--name-only', '-z', before, os.environ['GITHUB_SHA']],
                  check=True, capture_output=True,
              )
              paths = result.stdout.decode().split('\0')
              build = any(
                  ('tests' not in Path(path).parts and path.startswith('legacy-app/app/')) or path in {
                      'dockerfile', '.dockerignore', '.github/workflows/build-and-push.yaml'
                  }
                  for path in paths
              )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"build_image={str(build).lower()}\n")
          PYTHON

  build-and-push:
    needs: changes
    if: needs.changes.outputs.build_image == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::673588459289:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --no-cache \
            --pull \
            -f dockerfile \
            -t "$IMAGE_URI" .

      - name: Trivy Image Scan
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            "$IMAGE_URI"

      - name: Push image to ECR
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Image pushed: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"


  deploy-staging:
    needs: [changes, build-and-push]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          (needs.build-and-push.result == 'success' ||
           (needs.changes.outputs.build_image == 'false' && needs.build-and-push.result == 'skipped')) }}
    uses: ./.github/workflows/staging-infra.yaml
    with:
      container_image: ${{ needs.build-and-push.outputs.image_uri || '' }}
